<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="apple-mobile-web-app-title" content="Trailer Room"><meta name="apple-mobile-web-app-status-bar-style" content="black">

  <link rel="apple-touch-startup-image" href="/splash/375x812@3x.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="/splash/414x896@2x.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="/splash/414x896@3x.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="/splash/390x844@3x.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="/splash/428x926@3x.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="/splash/393x852@3x.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="/splash/430x932@3x.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="/splash/402x874@3x.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="/splash/440x956@3x.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="/splash/420x912@3x.png" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <title>Trailer Room</title>
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components/button.css">
  <link rel="stylesheet" href="/css/components/switch.css">
  <link rel="stylesheet" href="/css/components/check.css">
  <link rel="stylesheet" href="/css/components/range.css">
  <link rel="stylesheet" href="/css/components/select.css">
  <link rel="stylesheet" href="/css/components/menu.css">
  <link rel="stylesheet" href="/css/components/panel-heading.css">
  <link rel="stylesheet" href="/css/components/dialog.css">
  <link rel="stylesheet" href="/css/components/spinner.css">
  <link rel="stylesheet" href="/css/components/collapse.css">
  <link rel="stylesheet" href="/css/components/chip.css">
  <link rel="stylesheet" href="/css/features/mast.css">
  <link rel="stylesheet" href="/css/features/screen.css">
  <link rel="stylesheet" href="/css/features/crt.css">
  <link rel="stylesheet" href="/css/features/dock.css">
  <link rel="stylesheet" href="/css/features/film-info.css">
  <link rel="stylesheet" href="/css/features/queue.css">
  <link rel="stylesheet" href="/css/features/programming.css">
  <link rel="stylesheet" href="/css/features/preferences.css">
</head>
<body>
  <svg width="0" height="0" class="definitions" aria-hidden="true">
    <defs>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9m4 0h3M4 17h3m4 0h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="m5 5 11 7-11 7z" fill="currentColor" stroke="none"/><path d="M18 5v14"/></symbol>
      <symbol id="i-full" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m6 0h5v-5"/></symbol>
      <symbol id="i-exit" viewBox="0 0 24 24"><path d="M4 9h5V4m11 5h-5V4M4 15h5v5m11-5h-5v5"/></symbol>
      <symbol id="i-theater" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="1.8"/><path d="M3 15.5h18"/></symbol>
      <symbol id="i-crt" viewBox="0 0 24 24"><path d="M4 4.5q8-1.5 16 0 1.5 6.5 0 13-8 1.5-16 0-1.5-6.5 0-13Z"/><path d="M7.5 8.5h9m-9 4h9M8 21h8"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5 20 12 7 19.5z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-volume" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zM16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
      <symbol id="i-muted" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zM16 9l6 6m0-6-6 6"/></symbol>
      <symbol id="i-alternate" viewBox="0 0 24 24"><path d="M3 7h3c4 0 6 10 10 10h5m-4-4 4 4-4 4M3 17h3c1.6 0 3.1-1.8 4.1-3.3M14 8.5c.7-.9 1.4-1.5 2.5-1.5H21m-4-4 4 4-4 4"/></symbol>
      <symbol id="i-hide" viewBox="0 0 24 24"><path d="m3 3 18 18M10 5.3a13 13 0 0 1 2-.2c5.5 0 9 6.9 9 6.9a19 19 0 0 1-3.3 4.3M6.4 6.6A21 21 0 0 0 3 12s3.5 6.9 9 6.9c1.7 0 3.1-.4 4.4-1.1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
      <symbol id="i-remove" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    </defs>
  </svg>
  <header class="mast">
    <h1 class="mast-title"><svg class="brand-mark" aria-hidden="true" viewBox="1 4.5 30 23" width="30" height="23"><use href="/logos/trailer-room.svg?v=7#monogram"/></svg>Trailer Room</h1>
    <button id="preferences" class="button button--icon mast-preferences" aria-label="Programming" title="Programming" aria-haspopup="dialog" aria-controls="settings"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg></button>
  </header>
  <main class="page">
    <section id="theater" class="theater" aria-label="Trailer player">
      <div class="display" id="stage" data-transport="preview" tabindex="-1" role="group" aria-label="Trailer screen">
        <div id="screen" class="screen">
          <div id="art" class="screen-art"></div><div id="embed" class="screen-embed"></div>
          <div class="raster" aria-hidden="true">
            <svg viewBox="0 0 1000 562.5" preserveAspectRatio="none">
              <path fill="#060707" fill-rule="evenodd" d="M0 0h1000v562.5H0z M1.8 12Q2 3 13 2.8Q500 -1 987 2.8Q998 3 998.2 12Q1001 280 998.2 550.5Q998 559.5 987 559.7Q500 563.5 13 559.7Q2 559.5 1.8 550.5Q-1 280 1.8 12Z"/>
            </svg>
          </div>
          <div id="cover" class="screen-cover"><span id="cue" class="sr-only screen-cue" role="status">Loading film sources</span><span class="spinner spinner--on-picture" aria-hidden="true"></span>
            <button id="start" class="start" hidden><span class="start-pill spinner spinner--on-pill"><svg class="icon" aria-hidden="true"><use href="#i-play"/></svg><span id="startText">Play trailers</span></span></button>
          </div>
        </div>
        <div class="wake-surface" aria-hidden="true"></div>
        <div class="dock" id="dock" role="group" aria-label="Playback controls">
          <h2 id="title" class="dock-title">Loading your library…</h2>
          <input id="timeline" class="range range--timeline" type="range" min="0" max="100" step=".25" value="0" aria-label="Trailer position" disabled>
          <div class="transport">
            <div class="controls">
              <button id="play" class="button button--on-video button--icon dock-button dock-playback-only" aria-label="Play" title="Play or pause (Space)" disabled><svg class="icon" aria-hidden="true"><use id="playIcon" href="#i-play"/></svg></button>
              <button id="next" class="button button--on-video dock-button" aria-label="Next film" title="Next film (N)" aria-keyshortcuts="N" disabled><svg class="icon" aria-hidden="true"><use href="#i-next"/></svg><span id="nextLabel" class="dock-preview-only">Next film</span></button>
              <button id="mute" class="button button--on-video button--icon dock-button dock-playback-only" aria-label="Mute" title="Mute" disabled><svg class="icon" aria-hidden="true"><use id="volumeIcon" href="#i-volume"/></svg></button>
              <input id="volume" class="range range--volume dock-playback-only" type="range" min="0" max="100" value="100" aria-label="Volume" disabled>
            </div>
            <div class="controls view-controls">
              <button id="moreControls" class="button button--on-video button--icon view-button view-more" aria-label="More player controls" aria-expanded="false" aria-controls="viewTools"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path fill="currentColor" stroke="none" d="M5 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/></svg></button>
              <div id="viewTools" class="view-tools" role="group" aria-label="Viewing options">
              <button id="cc" class="button button--on-video button--icon view-button view-button--text dock-playback-only" aria-pressed="false" aria-label="Closed captions" title="Closed captions" disabled>CC</button>
              <button id="crt" class="button button--on-video button--icon view-button" aria-pressed="false" aria-label="CRT effect" title="CRT effect"><svg class="icon" aria-hidden="true"><use href="#i-crt"/></svg></button>
              <button id="wide" class="button button--on-video button--icon view-button theater-toggle" aria-label="Theater mode" aria-pressed="false" aria-keyshortcuts="T" title="Theater mode (T)"><svg class="icon" aria-hidden="true"><use href="#i-theater"/></svg></button>
              </div>
              <button id="full" class="button button--on-video button--icon view-button" title="Fullscreen (F)" aria-label="Fullscreen"><svg class="icon" aria-hidden="true"><use id="fullIcon" href="#i-full"/></svg></button>
            </div>
          </div>
        </div>
      </div>
      <section class="film-info" id="filmInfo" aria-labelledby="filmTitle" aria-busy="true">
        <div class="film-heading"><h2 id="filmTitle" class="film-title"></h2><p id="credit" class="film-credit"></p></div>
        <div class="film-facts"><p id="meta"></p></div>
        <div class="film-synopsis">
          <p id="synopsis" class="collapse collapse--preview film-synopsis-text" data-collapsed></p>
          <button id="synopsisToggle" class="button button--text button--flush film-synopsis-toggle" type="button" aria-expanded="false" aria-controls="synopsis" hidden>More</button>
        </div>
        <details id="filmOptions" class="menu film-options">
          <summary class="menu-toggle" aria-label="Film options" title="Film options"><svg class="menu-toggle-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></summary>
          <div class="menu-list">
            <button id="alternate" class="button menu-item" disabled><svg class="icon icon--sm" aria-hidden="true"><use href="#i-alternate"/></svg>Different trailer next time</button>
            <button id="hide" class="button menu-item" disabled><svg class="icon icon--sm" aria-hidden="true"><use href="#i-hide"/></svg>Hide movie</button>
          </div>
        </details>
      </section>
      <p id="status" class="status" role="status"></p>
    </section>
    <aside class="sidebar">
      <section class="queue" aria-busy="true"><div class="panel-heading"><h2 class="panel-title">Up next</h2><span id="remaining" class="panel-count"></span></div>
        <button id="programmingSummary" class="button button--flush queue-programming" type="button" aria-haspopup="dialog" aria-controls="settings" title="Change programming"></button>
        <div class="queue-preview"><ol id="queue" class="queue-list"></ol><p id="queueEmpty" class="queue-empty"></p></div></section>
    </aside>
  </main>
  <dialog id="settings" class="dialog dialog--sheet programming" aria-labelledby="settingsTitle">
    <div class="panel-heading"><h2 id="settingsTitle" class="panel-title">Programming</h2><span id="programmingCount" class="panel-count"></span>
      <button id="close" class="button button--icon dialog-close" type="button" aria-label="Close" title="Close (Esc)"><svg class="icon" aria-hidden="true"><use href="#i-remove"/></svg></button></div>
    <p id="programmingEmpty" class="collapse programming-empty" hidden>No films match. <button id="clearFilters" class="button button--inline" type="button">Clear filters</button></p>
    <section class="programming-group" aria-labelledby="sourcesLabel">
      <h3 class="programming-label" id="sourcesLabel">Sources</h3>
      <div id="sources" class="source-list"></div>
    </section>
    <section class="programming-group" aria-labelledby="plexLabel">
      <div class="programming-header"><h3 class="programming-label" id="plexLabel">Plex</h3><div id="plexActions" class="button-group"></div></div>
      <div id="plexRows" class="collapse"></div>
      <p id="plexMessage" class="collapse plex-message" role="status"></p>
    </section>
    <section class="programming-group" aria-labelledby="decadeLabel">
      <div class="programming-header"><h3 class="programming-label" id="decadeLabel">Decade</h3><span id="decadeValue" class="panel-count"></span></div>
      <div id="decades" class="range-pair" role="group" aria-labelledby="decadeLabel">
        <input id="decadeFrom" class="range" type="range" min="0" max="0" step="1" value="0" aria-label="Earliest decade" disabled>
        <input id="decadeTo" class="range" type="range" min="0" max="0" step="1" value="0" aria-label="Latest decade" disabled>
      </div>
    </section>
    <section class="programming-group" aria-labelledby="genreLabel">
      <h3 class="programming-label" id="genreLabel">Genre</h3>
      <p id="genreStatus" class="programming-note" role="status"></p>
      <div id="genres" class="chips collapse" role="group" aria-labelledby="genreLabel"></div>
    </section>
    <section class="programming-group" aria-labelledby="ratingLabel">
      <h3 class="programming-label" id="ratingLabel">Rating</h3>
      <div class="rating-filter">
        <label for="maxRating">Up to U.S. rating</label>
        <select id="maxRating" class="select"><option value="">Any rating</option></select>
        <label class="switch-row"><span class="switch-row-label">Include unrated films</span><input type="checkbox" id="includeUnrated"><span class="switch" aria-hidden="true"></span></label>
      </div>
    </section>
    <section class="programming-group">
      <button id="hiddenToggle" class="button button--flush programming-fold" type="button" aria-expanded="false" aria-controls="hiddenList"><span>Hidden movies</span><span id="hiddenCount" class="panel-count"></span><svg class="icon icon--sm" aria-hidden="true" viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></svg></button>
      <div id="hiddenList" class="collapse" data-collapsed></div>
      <button id="skippedToggle" class="button button--flush programming-fold" type="button" aria-expanded="false" aria-controls="skippedList"><span>Skipped trailers</span><span id="skippedCount" class="panel-count"></span><svg class="icon icon--sm" aria-hidden="true" viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></svg></button>
      <div id="skippedList" class="collapse" data-collapsed></div>
    </section>
  </dialog>
  <script type="module" src="/js/main.js"></script>
</body></html>
